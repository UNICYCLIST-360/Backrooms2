  lamp.intensity=M.full?1.1:.2;torch.intensity=(FL&&!hid)?(M.full?1:3.6)+(Math.random()<.012?-2:0):0;if(!theme(level).sewer)exitMesh.rotation.y+=dt;espMon();tick2(dt);lightM.color.setRGB(1,.98,.88).multiplyScalar(Math.random()<.04?.3+Math.random()*.4:1);
  if(M.esp){pathT-=dt;if(pathT<=0){pathT=.4;updPath()}const dx=exitPos.x-P.x,dz=exitPos.z-P.z,ang=Math.atan2(dx*Math.cos(P.yaw)-dz*Math.sin(P.yaw),-dx*Math.sin(P.yaw)-dz*Math.cos(P.yaw));document.getElementById('esp').innerHTML='<i style="transform:rotate('+ang*180/Math.PI+'deg)">▲</i>FINISH '+Math.round(Math.hypot(dx,dz))+'m'}
  hud.innerHTML='LEVEL '+level+(M.god?' · GOD':'')+(M.noclip?' · NOCLIP':'')+(unlocked?'':'')+(M.mesp?monList():'')+(hid?'<br>HIDING - press E to leave':lockerNear()?'<br>[E] Hide in locker':'')+'<br>EXIT: '+Math.round(Math.hypot(P.x-exitPos.x,P.z-exitPos.z))+'m';
  ren.render(scene,cam)}
function buildLockers(){lockers=[];const cand=[];for(let z=1;z<G-1;z++)for(let x=1;x<G-1;x++){if(grid[z][x])continue;const ws=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>grid[z+b][x+a]);if(ws.length)cand.push([x,z,ws])}
  cand.sort(()=>Math.random()-.5).slice(0,Math.max(5,Math.floor(G/2.2))).forEach(([x,z,ws])=>{const [a,b]=ws[Math.floor(Math.random()*ws.length)],px=(x+.5)*S+a*(S/2-.3),pz=(z+.5)*S+b*(S/2-.3),L=new THREE.Group();
    L.add(box(.9,2.1,.6,0x3d4a47,0,1.05,0));L.add(box(.8,1.95,.04,0x2b3533,0,1.05,.32));L.add(box(.05,.25,.05,0x999999,.3,1.05,.36));for(let i=0;i<4;i++)L.add(box(.5,.03,.02,0x050505,0,1.75+i*.07,.345));
    const mk=new THREE.Mesh(new THREE.BoxGeometry(1,2.2,.8),new THREE.MeshBasicMaterial({color:0x4da6ff,transparent:true,opacity:.4,depthTest:false,fog:false}));mk.position.y=1.05;mk.renderOrder=996;mk.visible=M.lesp;L.add(mk);
    L.position.set(px,0,pz);L.rotation.y=Math.atan2(-a,-b);world.add(L);lockers.push({x:px,z:pz,ox:-a,oz:-b,mk})})}
let scT;function scare(txt){const s=document.getElementById('sc'),r=document.getElementById('red');s.textContent=txt;s.className='';void s.offsetWidth;s.className='on';r.style.opacity=1;shake=Math.max(shake,.4);sting('saw');setTimeout(()=>r.style.opacity=0,160);clearTimeout(scT);scT=setTimeout(()=>s.className='',1500)}
function sting(k){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const n=AC.currentTime,g=AC.createGain(),o=AC.createOscillator(),o2=AC.createOscillator(),saw=k==='saw',dur=saw?.8:2;g.connect(AC.destination);o.type='sawtooth';o2.type='square';
  o.frequency.setValueAtTime(saw?300:900,n);o.frequency.exponentialRampToValueAtTime(saw?1500:120,n+(saw?.35:1.6));o2.frequency.setValueAtTime(saw?310:930,n);o2.frequency.exponentialRampToValueAtTime(saw?1650:90,n+(saw?.35:1.6));
  g.gain.setValueAtTime(saw?.25:.5,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);o2.connect(g);o.start(n);o2.start(n);o.stop(n+dur);o2.stop(n+dur);
  const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const ns=AC.createBufferSource(),ng=AC.createGain();ns.buffer=b;ng.gain.value=saw?.15:.4;ns.connect(ng).connect(AC.destination);ns.start(n)}catch(e){}}
function los(x1,z1,x2,z2){const d=Math.hypot(x2-x1,z2-z1),n=Math.ceil(d/.6);for(let i=1;i<n;i++){const k=i/n;if(wall(x1+(x2-x1)*k,z1+(z2-z1)*k))return false}return true}
function remGz(){monsters=monsters.filter(o=>{if(o.kind==='gz'){world.remove(o.m);return false}return true});flash('Godzilla removed','#35f07a')}
function lockerNear(){return lockers.some(l=>Math.hypot(l.x-P.x,l.z-P.z)<2.4)}
function toggleHide(){if(P.dead)return;const ov=document.getElementById('hide');
  if(hid){const l=hid;hid=null;P.x=l.x+l.ox*1.1;P.z=l.z+l.oz*1.1;hideT=0;ov.style.display='none';return}
  let b=null,bd=2.4;for(const l of lockers){const d=Math.hypot(l.x-P.x,l.z-P.z);if(d<bd){bd=d;b=l}}
  if(!b){flash('No locker nearby','#d9c24a');return}
  hid=b;P.x=b.x;P.z=b.z;P.yaw=Math.atan2(-b.ox,-b.oz);P.pitch=0;ov.style.display='block'}
function espMon(){for(const o of monsters){if(!o.esp){const gz=o.kind==='gz',m=new THREE.Mesh(new THREE.BoxGeometry(gz?3:1,gz?5:2.1,gz?3:1),new THREE.MeshBasicMaterial({color:o.kind==='face'?0xffdd00:o.kind==='run'?0x00e5ff:o.kind==='phonk'?0xd36bff:o.kind==='car'?0xff8a00:0xff2d2d,transparent:true,opacity:.45,depthTest:false,fog:false}));m.position.y=gz?2.5:1;m.renderOrder=997;o.m.add(m);o.esp=m}o.esp.visible=M.mesp}}
function monList(){return monsters.map(o=>'<br>⚠ '+(o.kind==='gz'?'GODZILLA':o.kind==='face'?'<span style="color:#ffdd00">THE FACE</span>':o.kind==='run'?'<span style="color:#00e5ff">THE RUNNER</span>':o.kind==='phonk'?'<span style="color:#d36bff">PHONK MONSTER</span>':o.kind==='car'?'<span style="color:#ff8a00">CAR MONSTER</span>':'ENTITY')+' '+Math.round(Math.hypot(o.m.position.x-P.x,o.m.position.z-P.z))+'m').join('')}
function updPath(){const sx=Math.floor(P.x/S),sz=Math.floor(P.z/S),ex=EX,ez=EZ;if(sx<0||sz<0||sx>=G||sz>=G)return;const prev={},q=[[sx,sz]];prev[sx+','+sz]=null;
  while(q.length){const [x,z]=q.shift();if(x===ex&&z===ez)break;for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+a,nz=z+b,k=nx+','+nz;if(nx<0||nz<0||nx>=G||nz>=G||grid[nz][nx]||k in prev)continue;prev[k]=[x,z];q.push([nx,nz])}}
  if(!((ex+','+ez) in prev))return;const pts=[];let c=[ex,ez];while(c){pts.unshift(new THREE.Vector3((c[0]+.5)*S,.2,(c[1]+.5)*S));c=prev[c[0]+','+c[1]]}
  pts[0].set(P.x,.2,P.z);pathLine.geometry.setFromPoints(pts)}
